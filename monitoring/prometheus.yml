# deploy-monitoring.sh fills in the double-underscore placeholders from monitoring.env and each environment's server.env.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: trouble-painter
    static_configs:
      - targets: ['127.0.0.1:__PROD_METRICS_PORT__']
        labels: { env: prod }
      - targets: ['127.0.0.1:__DEV_METRICS_PORT__']
        labels: { env: dev }

  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:__NODE_EXPORTER_PORT__']
